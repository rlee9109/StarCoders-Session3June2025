<div>
  @if (result()) {
    <fa-icon
      [ngStyle]="{'margin-right': '1rem', 'color': iconColor()}"
      [icon]="iconStyle()"
      [title]="`Genre: ${result()?.genres?.join(', ')}`"
      />
  }
  <span>Choose a Genre: </span>
  <div style="margin-left: 2rem">
    <input type="radio" id="all" value="All" [formField]="preferredGenreForm">
    <label for="all">
      Any
    </label>
    <input type="radio" value="Action" id="actionOption" [formField]="preferredGenreForm">
    <label for="actionOption">
      Action
    </label>
    <input type="radio" value="Comedy" id="comedyOption" [formField]="preferredGenreForm">
    <label for="comedyOption">
      Comedy
    </label>
    <input type="radio" value="Drama" id="dramaOption" [formField]="preferredGenreForm">
    <label for="dramaOption">
      Drama
    </label>
  </div>
</div>
